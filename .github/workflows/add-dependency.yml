# .github/workflows/add-dependency.yml
#
# Manually-triggered workflow: installs a given npm package, then commits
# the updated package.json and package-lock.json straight to main.
# Useful when you don't have Node/npm handy locally and just need the
# lockfile to catch up so Vercel's build actually installs the package.

name: Add npm dependency

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to install, e.g. bedrock-protocol or bedrock-protocol@3.40.0"
        required: true
        default: "bedrock-protocol"

permissions:
  contents: write

jobs:
  add-dependency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the package
        run: npm install "${{ inputs.package }}" --save

      - name: Commit updated package.json and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Add dependency: ${{ inputs.package }}"
          git push origin main
